[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-workbench"
version = "0.1.0"
description = "Human-in-the-loop kit for long AI-agent jobs: review pages with ticks and comments the agent can read, a memory governor, network pacing, a resumable download queue. Claude Code plugin + plain CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Khalid Benjelloun" }]
keywords = ["ai-agents", "claude-code", "human-in-the-loop", "review", "mcp", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
awb = "agent_workbench.cli:main"
agent-workbench = "agent_workbench.cli:main"

[project.urls]
Homepage = "https://github.com/kmbenjel/agent-workbench"
Documentation = "https://benjelloun.dev/warraq"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_workbench"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "skills", "commands", ".claude-plugin", ".mcp.json", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["agent_workbench"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105", "B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E701", "E702", "SIM115", "B007"]
